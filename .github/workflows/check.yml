name: Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run validate:online
      - run: npm run validate:ui
      - run: npm run validate:load
